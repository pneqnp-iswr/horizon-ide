name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Web build smoke test
        run: npm run smoke:web
      - name: Rust unit tests (core, no desktop runtime)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
