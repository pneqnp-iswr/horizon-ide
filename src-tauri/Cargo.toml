[package]
name = "horizon-ide"
version = "0.1.0"
description = "Horizon IDE desktop shell"
authors = ["Horizon IDE Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "horizon_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", optional = true, features = [] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }
